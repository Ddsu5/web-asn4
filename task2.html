<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Assignment 4: HTML forms, Bootstrap styling and CSS validation.">
  <title>Task 2 — Bootstrap styling | Assignment 4</title>
  <link rel="stylesheet" href="vendor/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Forms Lab</a>
      <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Tasks 0 &amp; 1</a>
          <a href="task2.html" aria-current="page">Task 2</a>
          <a href="task3.html">Task 3</a>
          <a href="task4.html">Task 4</a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    <h1>Bootstrap contact form</h1>
    <p class="intro">Name and email share a row on larger screens.</p>
    <form action="success.html" method="get" class="row g-3">
      <div class="col-md-6">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" name="name" class="form-control" placeholder="Enter your name" required maxlength="50">
      </div>
      <div class="col-md-6">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="name@example.com" required maxlength="100">
        <div class="form-text">Use an email address where we can reply.</div>
      </div>
      <div class="col-12">
        <label for="message" class="form-label">Message</label>
        <textarea id="message" name="message" class="form-control" placeholder="Write your message" required maxlength="500" rows="5"></textarea>
      </div>
      <div class="col-12">
        <button type="submit" class="btn btn-primary">Send message</button>
      </div>
    </form>
  </main>
  <footer class="site-footer">Daniyal Akylbek · SE-2530 · Assignment 4</footer>
</body>
</html>
