<!DOCTYPE html>

<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Forms Lab</a>
      <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html" aria-current="page">Tasks 0 &amp; 1</a>

          <a href="task4.html">Task 4</a>
      </nav>
    </div>
  </header>
  <main class="page-content">
    <h1>Contact form</h1>
    <p class="intro">Tasks 0 and 1: a contact form with HTML5 validation. All fields are required.</p>
    <form action="success.html" method="get" class="basic-form">
      <div class="field">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required maxlength="50">
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required maxlength="100">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Write your message" required maxlength="500" rows="5" ></textarea>
      </div>
      <div>
        <button type="submit" class="plain-button">Send message</button>
      </div>
    </form>
  </main>
  <footer class="site-footer">Daniyal Akylbek · SE-2530 · Assignment 4</footer>
</body>
</html>
